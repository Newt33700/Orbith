name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build et tests (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler
        run: npm run build

      - name: Tester
        run: npm test

  smoke:
    name: Test de fumée de la CLI (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Compiler
        run: npm run build

      - name: Configurer Git
        run: |
          git config --global user.name "Orbith CI"
          git config --global user.email "ci@orbith.invalid"

      - name: Installer Orbith dans un projet temporaire
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          echo "ORBITH_WORK=$WORK" >> "$GITHUB_ENV"
          cd "$WORK"
          git init -q
          node "$GITHUB_WORKSPACE/bin/orbith.js" install --yes --nom demo

      - name: Vérifier le projet (check)
        working-directory: ${{ env.ORBITH_WORK }}
        run: node "$GITHUB_WORKSPACE/bin/orbith.js" check

      - name: Prochaine action (next)
        working-directory: ${{ env.ORBITH_WORK }}
        run: node "$GITHUB_WORKSPACE/bin/orbith.js" next
