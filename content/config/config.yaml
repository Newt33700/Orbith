# Configuration Orbith du projet.
# Ce fichier est créé à l'installation (npx orbith install). Tu peux le modifier ;
# lance ensuite `npx orbith update` si tu changes une plateforme.

version: 1
orbith_version: 0.1.0

projet:
  # Nom du projet, utilisé dans les documents générés.
  nom: mon-projet

# Plateformes d'IA pour lesquelles Orbith génère les commandes.
#   gemini : Gemini CLI (commandes /orbith:po, etc.)
#   claude : Claude Code (commandes /orbith-po, etc.)
#   copilot : GitHub Copilot dans VS Code (facultatif ; .github/prompts/orbith-po.prompt.md, etc.)
plateformes: [gemini, claude]

# Piste par défaut, selon le type de travail :
#   correctif  : corriger un bug (story courte)
#   evolution  : ajouter ou modifier une fonctionnalité
#   projet     : démarrer un projet complet (brief, PRD, UX, architecture, epics)
piste: evolution

backlog:
  # Préfixe des identifiants de stories : US-001, US-002, etc.
  prefixe: US

csr:
  # Fichier du Cadre de Référence (référentiel technique de l'entreprise).
  fichier: .orbith/csr/CSR.md
  # Source du CSR (facultative). Trois formats possibles :
  #   git+https://…#chemin/CSR.md  : dépôt Git privé (fichier CSR.md dans le dépôt)
  #   https://…                    : adresse qui renvoie le CSR
  #   /chemin/local/CSR.md         : fichier local
  # Synchronisée avec `npx orbith csr sync`.
  source: null

# FinOps : suivi du coût de l'IA. Les agents estiment la consommation de chaque tâche
# (voir la règle couts-ia) ; `npx orbith metriques` calcule les coûts à partir des prix ci-dessous.
finops:
  # Devise utilisée dans les estimations de coût.
  devise: EUR
  # Prix par million de jetons (entrée / sortie). EXEMPLES INDICATIFS : à faire remplacer par vos tarifs réels (équipe FinOps).
  # Chaque agent utilise la clé de sa famille de modèle, sinon `defaut`.
  prix:
    defaut: { entree: 3, sortie: 15 }
    claude-sonnet: { entree: 3, sortie: 15 }
    claude-opus: { entree: 15, sortie: 75 }
    gemini-pro: { entree: 1.25, sortie: 10 }
    gemini-flash: { entree: 0.3, sortie: 2.5 }

# Plugins optionnels, ajoutés avec `npx orbith plugin add <nom>`.
# Exemple : [backlog-md]
plugins: []

# Gouvernance (facultatif, désactivée par défaut) : voir le guide Orbith en ligne : https://github.com/Newt33700/Orbith/blob/main/docs/guide/changements-roles.md
# changements:
#   exiger_pour_deploiement: true     # `orbith deploiement` exige une demande de changement validée
# roles:
#   quatre_yeux: true                 # on ne valide pas un fichier dont on a fait le dernier commit
#   valideurs:                        # qui peut valider quel type de document (email ou nom git)
#     prd: [alice@societe.fr]
#     change: ["Bob Martin"]

# Cibles DORA (facultatif) comparées aux valeurs mesurées par `npx orbith metriques` :
# voir le guide Orbith en ligne : https://github.com/Newt33700/Orbith/blob/main/docs/guide/metriques.md. Une clé inconnue ou une valeur non numérique est refusée.
# dora:
#   cibles:
#     frequence_par_semaine: 1        # au moins
#     delai_jours: 7                  # au plus
#     taux_echec_pct: 10              # au plus
#     retablissement_heures: 24       # au plus

# Politique de licences (facultatif), contrôlée par `npx orbith check` à partir du SBOM :
# voir le guide Orbith en ligne : https://github.com/Newt33700/Orbith/blob/main/docs/guide/integrite-sbom.md. S'ajoute à la catégorie « Licences » du CSR.
# sbom:
#   licences_interdites: [AGPL-3.0, GPL-3.0]

# Contrôle de documentation de `npx orbith check` (actif par défaut, avertissement seulement) :
# signale une US dont les commits modifient du code sans aucun fichier de documentation.
# documentation:
#   controle: false                   # désactive le contrôle
#   code: [src/, lib/]                # dossiers considérés comme du code (défaut : src/)

# Autopilote borné (facultatif) : `npx orbith autopilote` calcule, sans IA, les US que l'agent peut enchaîner
# (Dev puis QA) avant ta revue : voir le guide Orbith en ligne : https://github.com/Newt33700/Orbith/blob/main/docs/guide/autopilote.md.
# Les options --max-us et --budget de la commande remplacent ces valeurs.
# autopilote:
#   max_us: 3                         # US en attente de ta revue, au plus (défaut : 3)
#   budget: 20                        # plafond de coût IA estimé du périmètre, en finops.devise (défaut : aucun)
